<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta Fintech - Leave and details</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f2f4f1;--sf:#fff;--ink:#1c2a29;--mute:#5d6b69;--line:#d9dfdb;--ac:#2f4bd0;--aci:#fff;--okc:#1f7a4d;--okb:#e2f3ea;--bc:#b3362b;--bb:#f8e1de}
@media (prefers-color-scheme:dark){:root{--bg:#121917;--sf:#1b2523;--ink:#e6eeec;--mute:#9bacaa;--line:#2d3b38;--ac:#8ea0ff;--aci:#10163d;--okc:#6fd3a0;--okb:#17352a;--bc:#f09086;--bb:#3d1f1c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Public Sans",system-ui,sans-serif}
h1,h2{font-family:"Bricolage Grotesque",Georgia,sans-serif;margin:0}
h1{font-size:26px}h2{font-size:18px;margin:18px 0 8px}
main{max-width:560px;margin:0 auto;padding:22px 14px 40px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:18px}
.mute{color:var(--mute);font-size:13px}.sub{color:var(--mute);margin:4px 0 16px}
.tabs{display:flex;gap:6px;margin:0 0 16px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:8px;font:500 14px inherit;font-family:inherit;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ac);color:var(--aci);border-color:var(--ac)}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 0}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--ac);color:var(--aci);font:600 15px inherit;font-family:inherit;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.err{margin:14px 0 0;padding:9px 12px;border-radius:8px;background:var(--bb);color:var(--bc);font-size:14px}
.ok{padding:14px;border-radius:8px;background:var(--okb);color:var(--okc);font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Meta Fintech</h1>
<p class="sub" id="hi">Loading...</p>
<div class="card" id="box"></div>
</main>
<script type="module">
const FB="https://www.gstatic.com/firebasejs/13.2.0/";
const {initializeApp}=await import(FB+"firebase-app.js");
const {getFirestore,doc,getDoc,setDoc}=await import(FB+"firebase-firestore.js");
const db=getFirestore(initializeApp({apiKey:"AIzaSyASuZMqSs39jrwlDFpfmNUP2g8PkHaWX4s",authDomain:"meta-eeb73.firebaseapp.com",projectId:"meta-eeb73",storageBucket:"meta-eeb73.firebasestorage.app",messagingSenderId:"1066520166605",appId:"1:1066520166605:web:bda895fc57e6986715e984"}));
const P=new URLSearchParams(location.search),ID=(P.get("id")||"").trim(),TOK=(P.get("t")||"").trim(),NAME=(P.get("n")||"").trim().slice(0,80);
const $=s=>document.querySelector(s),box=$("#box");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=d=>new Date(d+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>"abcdefghjkmnpqrstuvwxyz23456789"[x%31]).join("")};
const newId=()=>"w"+Date.now().toString(36)+rnd(8);
const REL=["No change","Father","Mother","Spouse","Brother","Sister","Son","Daughter","Friend","Other"];
let PUB=null;
getDoc(doc(db,"pub","form")).then(s=>{if(s.exists())PUB=s.data()}).catch(()=>{});
async function notify(subject,message){
  try{
    if(!PUB||!PUB.svc||!PUB.tpl||!PUB.key||!(PUB.to||[]).length)return;
    const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
    await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",signal:c.signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:PUB.svc,template_id:PUB.tpl,user_id:PUB.key,template_params:{to_email:PUB.to.join(","),subject,message,employee:NAME||ID,emp_id:ID}})});
    clearTimeout(t);
  }catch(x){}
}
const who=()=>(NAME||ID)+" ("+ID+")";
let tab="leave";
function shell(){
  $("#hi").textContent=NAME?"Hello "+NAME+". What would you like to do?":"What would you like to do?";
  box.innerHTML=`<div class="tabs"><button type="button" data-t="leave" aria-pressed="${tab==="leave"}">Request leave</button><button type="button" data-t="details" aria-pressed="${tab==="details"}">Update my details</button></div><div id="pane"></div>`;
  box.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});
  tab==="leave"?leaveForm():detailsForm();
}
function done(msg){box.innerHTML=`<div class="ok">${esc(msg)}</div><button class="btn" id="again">Send another</button>`;$("#again").onclick=shell}
function leaveForm(){
  const t=ymd(new Date()),min=new Date();min.setDate(min.getDate()-30);
  $("#pane").innerHTML=`<form id="f" novalidate>
<label>Type of leave<select name="type"><option>Paid leave</option><option>Sick leave</option><option>Half day</option><option>Unpaid leave</option></select></label>
<label>From<input name="from" type="date" min="${ymd(min)}" value="${t}" required></label>
<label id="tol">To<input name="to" type="date" min="${ymd(min)}" value="${t}" required></label>
<label>Reason<textarea name="why" rows="3" maxlength="300" required></textarea></label>
<p class="err" id="e" hidden></p>
<button class="btn" id="go">Send leave request</button><p class="mute">HR will review it and let you know.</p></form>`;
  const f=$("#f"),tp=f.type,tol=$("#tol");
  const sync=()=>{tol.hidden=tp.value==="Half day"};tp.onchange=sync;sync();
  f.from.onchange=()=>{if(f.to.value<f.from.value)f.to.value=f.from.value};
  f.onsubmit=async ev=>{ev.preventDefault();const e=$("#e");e.hidden=true;
    const type=tp.value,from=f.from.value,to=type==="Half day"?from:f.to.value,why=f.why.value.trim();
    const bad=!from||!to?"Please choose the dates.":to<from?"The end date cannot be before the start date.":(new Date(to)-new Date(from))/864e5>60?"Please contact HR for leave longer than 60 days.":!why?"Please give a reason.":"";
    if(bad){e.textContent=bad;e.hidden=false;return}
    const rid=newId(),days=type==="Half day"?"0.5":String(Math.round((new Date(to)-new Date(from))/864e5)+1);
    $("#go").disabled=true;
    try{await setDoc(doc(db,"lr",rid),{rid,id:ID,n:NAME,type,from,to,why,st:"Pending",at:Date.now(),tok:TOK,src:"link"})}
    catch(x){$("#go").disabled=false;e.textContent="Could not send. Check your internet and try again, or ask HR for a new link.";e.hidden=false;return}
    await notify("Leave request: "+who()+", "+fmt(from)+(to!==from?" to "+fmt(to):""),
      "New leave request\n\nEmployee: "+who()+"\nType: "+type+"\nFrom: "+fmt(from)+"\nTo: "+fmt(to)+"\nDays: "+days+"\nReason: "+why+"\n\nOpen the HR portal, Leave requests page, to approve or reject it.");
    done("Your leave request has been sent to HR.");
  };
}
function detailsForm(){
  $("#pane").innerHTML=`<form id="f" novalidate><p class="mute" style="margin:0">Fill in only what has changed. HR will check it before it is saved.</p>
<label>Phone<input name="phone" type="tel" inputmode="tel" autocomplete="tel"></label>
<label>Email<input name="email" type="email" autocomplete="email"></label>
<label>Current address<input name="address"></label>
<label>Permanent address<input name="paddress"></label>
<h2>Emergency contact</h2>
<label>Name<input name="emerg"></label>
<label>Relationship<select name="erel">${REL.map(r=>`<option>${r}</option>`).join("")}</select></label>
<label>Mobile<input name="ephone" type="tel" inputmode="tel"></label>
<h2>Bank</h2>
<label>Bank name<input name="bankName"></label>
<label>Account number<input name="bank" inputmode="numeric"></label>
<label>IFSC code<input name="ifsc" autocapitalize="characters"></label>
<p class="err" id="e" hidden></p>
<button class="btn" id="go">Send changes to HR</button></form>`;
  const f=$("#f");
  f.onsubmit=async ev=>{ev.preventDefault();const e=$("#e");e.hidden=true;
    const d=Object.fromEntries(new FormData(f)),ch={};
    for(const k of Object.keys(d)){let v=String(d[k]||"").trim().slice(0,200);if(k==="erel"&&v==="No change")v="";if(v)ch[k]=v}
    if(ch.phone){ch.phone=ch.phone.replace(/[^\d+]/g,"")}
    if(ch.ephone){ch.ephone=ch.ephone.replace(/[^\d+]/g,"")}
    if(ch.ifsc)ch.ifsc=ch.ifsc.toUpperCase().replace(/\s/g,"");
    if(ch.bank)ch.bank=ch.bank.replace(/\s/g,"");
    const bad=!Object.keys(ch).length?"Fill in at least one field.":ch.phone&&ch.phone.replace(/\D/g,"").length<10?"Enter a valid phone number.":ch.ephone&&ch.ephone.replace(/\D/g,"").length<10?"Enter a valid emergency contact number.":ch.email&&!/^\S+@\S+\.\S+$/.test(ch.email)?"Enter a valid email address.":ch.ifsc&&!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ch.ifsc)?"The IFSC code does not look right (for example SBIN0001234).":ch.bank&&!/^\d{9,18}$/.test(ch.bank)?"The account number should be 9 to 18 digits.":"";
    if(bad){e.textContent=bad;e.hidden=false;return}
    $("#go").disabled=true;
    try{await setDoc(doc(db,"upd",newId()),{id:ID,tok:TOK,n:NAME,ch,st:"Pending",at:Date.now()})}
    catch(x){$("#go").disabled=false;e.textContent="Could not send. Check your internet and try again, or ask HR for a new link.";e.hidden=false;return}
    const L={phone:"Phone",email:"Email",address:"Current address",paddress:"Permanent address",emerg:"Emergency contact name",erel:"Emergency contact relationship",ephone:"Emergency contact mobile",bankName:"Bank name",bank:"Bank account number",ifsc:"IFSC code"},sec=new Set(["bankName","bank","ifsc"]);
    await notify("Details update: "+who(),"Detail update request\n\nEmployee: "+who()+"\n\n"+Object.keys(ch).map(k=>L[k]+": "+(sec.has(k)?"updated (see the portal)":ch[k])).join("\n")+"\n\nOpen the HR portal, Employees page, to apply or dismiss it.");
    done("Your changes have been sent to HR for review.");
  };
}
if(!ID||!TOK){$("#hi").textContent="";box.innerHTML='<p class="err" style="margin:0">This link is not valid. Please ask HR for a new link.</p>'}
else shell();
</script>
</body>
</html>
