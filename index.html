if(g("#nauto"))g("#nauto").onclick=async()=>{const h=hcur();if(!h||!fullEdit())return;const rc=holRecips().filter(hasMail);if(!rc.length)return toast("No employee has an email saved");if(!confirm((h.sent?"This holiday was already notified on "+fmt(h.sent)+". Send again?\n\n":"")+"Send this email to "+rc.length+" employees now?"))return;const b=g("#nauto");b.disabled=true;b.textContent="Sending...";let ok=0,bad=0;for(const e of rc){try{await addDoc(collection(db,"mail"),mailDoc(e,h));ok++}catch(x){bad++}}
if(ok){h.sent=today();log("Sent holiday email for "+h.name+" to "+ok+" employees");save()}toast(bad?ok+" queued, "+bad+" failed. Check that the Firestore rules allow sending.":"Email queued for "+ok+" employees. It is sent within a minute.");render()};
if(g("#ntest"))g("#ntest").onclick=async()=>{const h=hcur();if(!h||!fullEdit())return;const em=(meP.email||"").trim();if(!em)return toast("Your account has no email");try{await addDoc(collection(db,"mail"),mailDoc({name:me,email:em,id:"test"},h));toast("Test email queued for "+em+". It arrives within a minute.")}catch(x){toast("Could not queue the email. Check that the Firestore rules allow sending.")}};
if(g("#ndel"))g("#ndel").onclick=async()=>{const h=hcur();if(!h)return;const o=g("#ndelout");o.textContent="Checking...";try{const ss=await getDocs(query(collection(db,"mail"),where("holId","==",h.id)));let ok=0,er=0,pe=0,msg="";ss.forEach(d=>{const dl=d.data().delivery||{};if(dl.state==="SUCCESS")ok++;else if(dl.state==="ERROR"){er++;if(!msg)msg=String(dl.error||"")}else pe++});o.textContent=ss.size?"Delivered: "+ok+". Waiting: "+pe+". Failed: "+er+"."+(msg?" First error: "+msg.slice(0,160):"")+(pe&&!ok&&!er?" If everything stays waiting, the Trigger Email extension is not set up yet.":""):"No emails have been sent for this holiday yet."}catch(x){o.textContent="Could not check. "+(x&&x.code==="permission-denied"?"Publish the updated Firestore rules first.":"Try again.")}};
$$("[data-wa]").forEach(b=>b.onclick=()=>{const e=emp(b.dataset.wa);if(!e)return;const fn=String(e.name||"").trim().split(/\s+/)[0]||"there";window.open("https://wa.me/"+waNum(e.phone)+"?text="+encodeURIComponent(nmsg().replace(/\{name\}/g,fn)),"_blank","noopener")});
$$("[data-gm]").forEach(b=>b.onclick=()=>window.open("https://mail.google.com/mail/?view=cm&fs=1&bcc="+enc(chunk(+b.dataset.gm))+"&su="+encodeURIComponent(subj())+"&body="+encodeURIComponent(team()),"_blank","noopener"));
$$("[data-ml]").forEach(b=>b.onclick=()=>{location.href="mailto:?bcc="+enc(chunk(+b.dataset.ml))+"&subject="+encodeURIComponent(subj())+"&body="+encodeURIComponent(team())});
if(g("#ncope"))g("#ncope").onclick=()=>copyT(mails().join(", "),"Email list copied");
if(g("#ncopy"))g("#ncopy").onclick=()=>copyT(team(),"Message copied");
if(g("#nclose"))g("#nclose").onclick=()=>{nh="";render()};
if(g("#ndone"))g("#ndone").onclick=()=>{const h=hcur();if(!h||!fullEdit())return;h.sent=today();log("Notified employees about holiday "+h.name);save();nh="";toast("Marked as notified");render()}}
$$("[data-rc]").forEach(sel=>sel.onchange=async()=>{const u=S.users.find(x=>x.uid===sel.dataset.rc);if(!u)return;const nr=sel.value,or=u.role;if(nr===or)return;if(!confirm("Change "+u.name+" from "+or+" to "+nr+"?")){sel.value=or;return}try{await setDoc(doc(db,"users",u.uid),{role:nr},{merge:true});log("Changed role of "+u.email+" from "+or+" to "+nr);toast("Role updated to "+nr)}catch(x){sel.value=or;toast(authMsg(x))}});
$$("[data-ru]").forEach(b=>b.onclick=async()=>{const u=S.users.find(x=>x.uid===b.dataset.ru);if(!u)return;if(confirm("Remove "+u.name+"? They will no longer be able to open the portal.")){try{await deleteDoc(doc(db,"users",u.uid));log("Removed user "+u.email);toast("User removed")}catch(x){toast(authMsg(x))}}});
}
$$("nav button").forEach(b=>b.onclick=async()=>{v=b.dataset.v;nh="";if(v==="out"){v="dash";try{await log("Signed out")}catch(x){}try{await signOut(auth)}catch(x){}return}render()});
try{await setPersistence(auth,browserSessionPersistence)}catch(x){}
onAuthStateChanged(auth,async u=>{if(busy)return;
if(!u){stopListeners();meP=null;me=null;setup=false;authReady=true;render();return}
try{const sn=await getDoc(doc(db,"users",u.uid));
if(!sn.exists()||!ROLES.includes(sn.data().role)){justIn=false;try{await signOut(auth)}catch(x){}toast("This account has no access to the portal. Ask the admin to add you.");return}
meP={uid:u.uid,...sn.data()};me=meP.name||u.email;authReady=true;
if(meP.role==="Marketing"){if(justIn){justIn=false;mkLogin()}loaded=true;render();return}
if(justIn){justIn=false;log("Signed in")}
startListeners();render()}
catch(x){justIn=false;console.error(x);try{await signOut(auth)}catch(_){}authReady=true;const c=(x&&x.code)||(x&&x.name)||"error";toast(c==="permission-denied"?"Could not load your account: the Firestore rules do not allow it. In Firebase open Firestore, then Rules, and publish the portal rules.":c==="unavailable"?"Could not reach the database. Check your internet connection or any ad blocker.":"Could not load your account ("+c+"). Please send this message to your developer.")}});
render();
</script>
