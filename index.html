ce.data.amt >= 0 && request.resource.data.amt <= 100000000\n        && request.resource.data.dam is number && request.resource.data.dam >= 0 && request.resource.data.dam <= 1000000000\n        && (!('lg' in request.resource.data) || request.resource.data.lg is bool)\n        && request.resource.data.ed == request.time;\n      allow delete: if isEditor();\n    }\n\n    // NEW: monthly marketing targets. Admin and Operations can set them; every signed-in user can read.\n    match /mt/{m} {\n      allow read: if isStaff() || isTL() || isMkt();\n      allow write: if isAdmin() || isOps();\n    }\n\n    // NEW: sign-in history of Marketing logins\n    match /logins/{id} {\n      allow read: if isStaff();\n      allow create: if isMkt() && request.resource.data.keys().hasOnly(['uid','name','email','at','dev','lat','lng'])\n        && request.resource.data.uid == request.auth.uid\n        && request.resource.data.at == request.time;\n      allow update: if false;\n      allow delete: if isEditor();\n    }\n\n    // NEW: agent photos for the display board (small pictures, Admin and Operations only)\n    match /photos/{id} {\n      allow read: if isStaff() || isTL();\n      allow write: if (isAdmin() || isOps()) && (request.resource == null || (request.resource.data.keys().hasOnly(['d','at']) && request.resource.data.d is string && request.resource.data.d.size() < 200000));\n    }\n\n    match /logs/{id} { allow read: if isStaff(); allow create: if isStaff() || isTL(); allow delete: if isEditor(); }\n    match /mail/{id} {\n      allow read: if isEditor();\n      allow create: if isEditor()\n        && request.resource.data.keys().hasOnly(['to','holId','empId','sentBy','message'])\n        && request.resource.data.to is string\n        && request.resource.data.sentBy == request.auth.uid;\n      // NEW: notification email sent from an employee link (only to HR/Admin addresses)\n      allow create: if request.resource.data.keys().hasOnly(['to','kind','empId','tok','at','message'])\n        && request.resource.data.kind == 'link'\n        && request.resource.data.to is list\n        && request.resource.data.to.size() >= 1 && request.resource.data.to.size() <= 10\n        && request.resource.data.to.hasOnly(get(/databases/$(database)/documents/pub/form).data.to)\n        && request.resource.data.empId is string\n        && get(/databases/$(database)/documents/emps/$(request.resource.data.empId)).data.tok == request.resource.data.tok\n        && request.resource.data.message.keys().hasOnly(['subject','text','html'])\n        && request.resource.data.message.subject.size() <= 200\n        && request.resource.data.message.text.size() <= 1500\n        && request.resource.data.message.html.size() <= 4000;\n      allow update, delete: if false;\n    }\n  }\n}\n";
